<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price Mitra</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Arial,sans-serif;
background:#f5f6fa;
color:#172033;
}

header{
background:linear-gradient(135deg,#6c5ce7,#8e44ad);
color:white;
padding:40px 18px 55px;
text-align:center;
border-radius:0 0 35px 35px;
}

.logo{font-size:34px;font-weight:bold}

.tagline{
margin-top:8px;
font-size:18px;
}

.search-box{
max-width:650px;
margin:28px auto 0;
display:flex;
background:white;
padding:6px;
border-radius:18px;
}

.search-box input{
flex:1;
border:0;
outline:0;
padding:15px;
font-size:17px;
min-width:0;
}

.search-box button{
border:0;
background:#6c5ce7;
color:white;
padding:0 22px;
border-radius:13px;
font-size:17px;
font-weight:bold;
}

.container{
max-width:950px;
margin:35px auto;
padding:0 18px;
}

.title{
font-size:25px;
margin-bottom:20px;
}

.categories{
display:flex;
gap:12px;
overflow-x:auto;
padding-bottom:10px;
}

.category{
background:white;
padding:15px 20px;
border-radius:15px;
white-space:nowrap;
box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.result{
margin-top:40px;
}

.empty{
text-align:center;
color:#777;
padding:25px;
}

.product-card{
display:none;
background:white;
padding:24px;
border-radius:22px;
box-shadow:0 7px 25px rgba(0,0,0,.08);
}

.product-name{
color:#6c5ce7;
font-size:26px;
font-weight:bold;
}

.subtitle{
color:#777;
margin-top:7px;
margin-bottom:22px;
}

.shop{
background:#f5f6fa;
padding:18px;
border-radius:15px;
margin:12px 0;
}

.shop-name{
font-size:19px;
font-weight:bold;
}

.view-btn{
display:inline-block;
margin-top:12px;
background:#6c5ce7;
color:white;
text-decoration:none;
padding:10px 17px;
border-radius:10px;
font-weight:bold;
}

footer{
text-align:center;
color:#777;
padding:40px 15px;
}

@media(max-width:600px){
.logo{font-size:29px}
.search-box button{padding:0 15px}
.product-card{padding:20px}
}
</style>
</head>

<body>

<header>

<div class="logo">💜 Price Mitra</div>

<div class="tagline">
Compare prices. Find the best deal.
</div>

<div class="search-box">

<input
id="searchInput"
type="text"
placeholder="Search any product..."
>

<button onclick="searchProduct()">
Search
</button>

</div>

</header>

<div class="container">

<h2 class="title">
Popular Categories
</h2>

<div class="categories">

<div class="category">📱 Mobiles</div>
<div class="category">💻 Laptops</div>
<div class="category">🎧 Headphones</div>
<div class="category">👟 Shoes</div>
<div class="category">⌚ Watches</div>

</div>

<div class="result">

<h2 class="title">
Search Result
</h2>

<div id="empty" class="empty">
Search for a product to compare prices.
</div>

<div id="productCard" class="product-card">

<div id="productName" class="product-name"></div>

<div class="subtitle">
Price comparison
</div>

<div id="shops"></div>

</div>

</div>

</div>

<footer>
© 2026 Price Mitra • Compare Smart. Buy Smart.
</footer>

<script>

const API =
"https://gentle-breeze-a7f9.sarkaterudra619.workers.dev";

async function searchProduct(){

const input =
document.getElementById("searchInput");

const product =
input.value.trim();

const empty =
document.getElementById("empty");

const card =
document.getElementById("productCard");

const name =
document.getElementById("productName");

const shops =
document.getElementById("shops");

if(product===""){

card.style.display="none";

empty.innerText=
"Please enter a product name.";

return;

}

empty.innerText=
"Searching...";

card.style.display="none";

try{

const response =
await fetch(
API + "/api/search?q=" +
encodeURIComponent(product)
);

const data =
await response.json();

name.innerText=
data.product;

shops.innerHTML="";

data.results.forEach(function(item){

const div =
document.createElement("div");

div.className="shop";

div.innerHTML=`

<div class="shop-name">
🛒 ${item.store}
</div>

<div style="margin-top:8px;font-size:22px;font-weight:bold">
₹${item.price.toLocaleString("en-IN")}
</div>

<a
class="view-btn"
href="${item.link}"
target="_blank"
rel="noopener noreferrer">
View Deal 🔗
</a>

`;

shops.appendChild(div);

});

empty.innerText=
"Price comparison results:";

card.style.display="block";

}catch(error){

card.style.display="none";

empty.innerText=
"Something went wrong. Please try again.";

}

}

</script>

</body>
</html>
