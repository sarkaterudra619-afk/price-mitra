<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price Mitra</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f6fa;
  color:#111827;
}

.hero{
  background:linear-gradient(135deg,#6d55e8,#9b43b5);
  padding:50px 25px 70px;
  border-radius:0 0 45px 45px;
  text-align:center;
}

.hero h1{
  color:white;
  font-size:42px;
  margin-bottom:12px;
}

.hero p{
  color:white;
  font-size:20px;
  margin-bottom:35px;
}

.search-box{
  max-width:650px;
  margin:auto;
  display:flex;
  background:white;
  padding:10px;
  border-radius:30px;
}

.search-box input{
  flex:1;
  border:0;
  outline:0;
  padding:15px;
  font-size:20px;
}

.search-box button{
  border:0;
  background:#6d55e8;
  color:white;
  padding:0 30px;
  border-radius:20px;
  font-size:18px;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:55px auto;
  padding:0 20px;
}

h2{
  font-size:36px;
  margin-bottom:30px;
}

.categories{
  display:flex;
  gap:20px;
  overflow-x:auto;
  margin-bottom:70px;
}

.category{
  background:white;
  padding:25px 45px;
  border-radius:25px;
  white-space:nowrap;
  font-size:22px;
  box-shadow:0 8px 25px rgba(0,0,0,.06);
}

.result{
  background:white;
  padding:35px;
  border-radius:35px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.result h3{
  color:#6652d9;
  font-size:34px;
  margin-bottom:10px;
}

.result p{
  font-size:20px;
  color:#777;
  margin-bottom:25px;
}

.shop{
  padding:22px;
  border-radius:22px;
  background:#f3f4f8;
  margin:15px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.shop.best{
  background:#dff8e8;
  border:3px solid #35b66b;
}

.shop-name{
  font-size:21px;
}

.price{
  font-size:24px;
  font-weight:bold;
}

.deal{
  display:block;
  text-decoration:none;
  background:#6d55e8;
  color:white;
  padding:13px 25px;
  border-radius:15px;
  font-weight:bold;
}

.best-text{
  color:#159447;
  font-size:22px;
  font-weight:bold;
  margin-top:25px;
}

.empty{
  text-align:center;
  color:#777;
  font-size:20px;
}

footer{
  text-align:center;
  padding:50px 20px;
  color:#777;
  font-size:18px;
}

@media(max-width:600px){
  .hero h1{
    font-size:34px;
  }

  .hero p{
    font-size:18px;
  }

  .search-box{
    padding:7px;
  }

  .search-box input{
    font-size:17px;
  }

  .search-box button{
    padding:0 20px;
  }

  h2{
    font-size:30px;
  }

  .result{
    padding:25px;
  }

  .shop{
    display:block;
  }

  .price{
    margin:10px 0;
  }

  .deal{
    display:inline-block;
  }
}
</style>
</head>

<body>

<section class="hero">
  <h1>💜 Price Mitra</h1>
  <p>Compare prices. Find the best deal.</p>

  <div class="search-box">
    <input id="searchInput" type="text" placeholder="Search product...">
    <button onclick="searchProduct()">Search</button>
  </div>
</section>

<div class="container">

  <h2>Popular Categories</h2>

  <div class="categories">
    <div class="category">📱 Mobiles</div>
    <div class="category">💻 Laptops</div>
    <div class="category">🎧 Headphones</div>
  </div>

  <h2>Search Result</h2>

  <div id="result">
    <div class="empty">
      Search for a product to compare prices.
    </div>
  </div>

</div>

<footer>
  © 2026 Price Mitra • Compare Smart. Buy Smart.
</footer>

<script>

function searchProduct(){

  const product = document.getElementById("searchInput").value.trim();

  if(product === ""){
    document.getElementById("result").innerHTML =
      '<div class="empty">Please enter a product name.</div>';
    return;
  }

  const search = encodeURIComponent(product);

  const amazon =
    "https://www.amazon.in/s?k=" + search;

  const flipkart =
    "https://www.flipkart.com/search?q=" + search;

  const meesho =
    "https://www.meesho.com/search?q=" + search;

  document.getElementById("result").innerHTML = `

    <div class="result">

      <h3>${product}</h3>

      <p>Price comparison</p>

      <div class="shop">
        <div class="shop-name">Amazon</div>
        <a class="deal" href="${amazon}" target="_blank">
          View Deal 🛒
        </a>
      </div>

      <div class="shop">
        <div class="shop-name">Flipkart</div>
        <a class="deal" href="${flipkart}" target="_blank">
          View Deal 🛒
        </a>
      </div>

      <div class="shop best">
        <div class="shop-name">🏆 Meesho</div>
        <a class="deal" href="${meesho}" target="_blank">
          View Deal 🛒
        </a>
      </div>

      <div class="best-text">
        🏆 Compare the prices and choose the best deal.
      </div>

    </div>

  `;
}

</script>

</body>
</html>
