<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price Mitra</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f6fa;
  color:#172033;
}

.container{
  max-width:700px;
  margin:auto;
  padding:30px 18px;
}

h1{
  text-align:center;
  color:#6547e8;
  font-size:38px;
}

.subtitle{
  text-align:center;
  font-size:20px;
  color:#666;
  margin-bottom:30px;
}

.product{
  background:white;
  border-radius:28px;
  padding:25px;
  box-shadow:0 10px 30px #00000012;
}

.platform{
  background:#f4f5fa;
  border-radius:24px;
  padding:25px;
  margin:20px 0;
}

.platform h2{
  margin:0 0 15px;
  font-size:28px;
}

.price{
  font-size:25px;
  font-weight:bold;
  color:#19a463;
  margin-bottom:15px;
}

button{
  background:#684de8;
  color:white;
  border:0;
  border-radius:14px;
  padding:14px 25px;
  font-size:18px;
  font-weight:bold;
}

footer{
  text-align:center;
  color:#777;
  margin-top:40px;
}
</style>
</head>

<body>

<div class="container">

<h1>Price Mitra</h1>

<div class="subtitle">
Compare this product across shopping platforms
</div>

<div class="product">

<h2>iPhone 16</h2>

<div id="results">
Loading prices...
</div>

</div>

<footer>
© 2026 Price Mitra • Compare Smart. Buy Smart.
</footer>

</div>

<script>

const API_URL =
"https://gentle-breeze-a7f9.sarkaterudra619.workers.dev";

async function loadPrices(){

  try{

    const response = await fetch(API_URL);

    const data = await response.json();

    const results = document.getElementById("results");

    results.innerHTML = "";

    data.results.forEach(item => {

      const card = document.createElement("div");

      card.className = "platform";

      card.innerHTML = `
        <h2>🛒 ${item.store}</h2>

        <div class="price">
          ₹${Number(item.price).toLocaleString("en-IN")}
        </div>

        <button onclick="alert('${item.store} deal')">
          View Deal 🔗
        </button>
      `;

      results.appendChild(card);

    });

  }catch(error){

    document.getElementById("results").innerHTML =
      "<p>Price load होत नाहीये. पुन्हा try करा.</p>";

    console.log(error);

  }

}

loadPrices();

</script>

</body>
</html>
